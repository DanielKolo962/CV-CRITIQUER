[project]
name = "cv-optimizer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Daniel kolo", email = "kolod5151@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "grok>=6.2",
    "langchain-groq>=1.1.3",
    "langchain-xai>=1.3.0",
